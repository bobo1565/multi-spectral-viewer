[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "align3d"
version = "0.1.0"
description = "3D reconstruction based multi-camera alignment for multispectral rigs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21,<2.0",
    "opencv-contrib-python-headless>=4.8.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0", "torchvision>=0.15.0"]
dev = ["pytest>=7.0"]

[project.scripts]
align3d = "align3d.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["align3d*"]
